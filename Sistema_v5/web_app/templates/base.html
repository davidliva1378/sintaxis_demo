<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monitor PJN{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Monitor PJN</h1>
            <ul class="nav-menu">
                <li><a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a></li>
                <li><a href="{{ url_for('entradas') }}" {% if request.endpoint == 'entradas' %}class="active"{% endif %}>Entradas</a></li>
                <li><a href="{{ url_for('expedientes') }}" {% if request.endpoint == 'expedientes' %}class="active"{% endif %}>Expedientes</a></li>
                <li><a href="{{ url_for('config') }}" {% if request.endpoint == 'config' %}class="active"{% endif %}>Configuración</a></li>
                <li><a href="{{ url_for('logs') }}" {% if request.endpoint == 'logs' %}class="active"{% endif %}>Logs</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Monitor PJN v5 - Sistema de monitoreo automatizado</p>
    </footer>
</body>
</html>
