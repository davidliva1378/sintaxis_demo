[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-pjn-v6"
version = "6.0.0"
description = "Sistema de extracción y monitoreo del Portal Judicial Nacional (Argentina) - v6 con Clean Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Equipo Sistema PJN", email = "dev@sistemapjn.com"}
]
keywords = ["pjn", "scraping", "judicial", "argentina", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business :: Legal",
]

dependencies = [
    # Web scraping
    "playwright>=1.50.0",

    # Web framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",

    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database (future)
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Scheduling
    "apscheduler>=3.11.0",

    # Notifications
    "plyer>=2.1.0",

    # Environment variables
    "python-dotenv>=1.0.0",

    # HTTP client
    "httpx>=0.25.0",

    # PDF processing (for MCP server)
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",

    # Date utilities
    "python-dateutil>=2.8.2",

    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",

    # Model Context Protocol
    "mcp>=1.0.0",

    # Cache
    "redis>=5.0.0",
    "hiredis>=2.3.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-playwright>=0.4.4",
    "pytest-xdist>=3.5.0",  # parallel testing

    # Code quality
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",

    # Type stubs
    "types-python-dateutil",
    "types-requests",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",

    # Development tools
    "ipython>=8.20.0",
    "ipdb>=0.13.13",
]

# IA Local plugins
ia = [
    "ollama>=0.1.0",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
]

# PDF processing plugins
pdf = [
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "spacy>=3.7.0",
]

# Oficios digitales plugins
oficios = [
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "cryptography>=41.0.0",
]

# All optional dependencies
all = [
    "sistema-pjn-v6[dev]",
    "sistema-pjn-v6[ia]",
    "sistema-pjn-v6[pdf]",
    "sistema-pjn-v6[oficios]",
]

[project.urls]
Homepage = "https://github.com/tu-usuario/sistema-pjn-v6"
Documentation = "https://sistema-pjn-v6.readthedocs.io"
Repository = "https://github.com/tu-usuario/sistema-pjn-v6"
Issues = "https://github.com/tu-usuario/sistema-pjn-v6/issues"

[project.scripts]
pjn = "presentation.cli.main:main"
pjn-api = "presentation.api.rest.main:start_server"
pjn-mcp = "presentation.api.mcp.server:main"

[tool.setuptools]
packages = ["core", "application", "infrastructure", "presentation", "plugins"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.ini", "*.cfg"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | venv
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/migrations/*", "**/node_modules/*", "**/venv/*"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*" = ["ARG", "S"]  # allow unused arguments and assert in tests

# Mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "plyer.*",
    "pdfplumber.*",
    "mcp.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "scraping: marks tests that involve web scraping",
    "asyncio: marks tests as async tests (for pytest-asyncio)",
]

# Pytest-asyncio configuration
[tool.pytest_asyncio]
mode = "auto"

[tool.coverage.run]
branch = true
source = ["core", "application", "infrastructure", "presentation", "plugins"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
