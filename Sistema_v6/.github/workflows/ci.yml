name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, sintaxis_parcial3 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install linting dependencies
        run: |
          pip install ruff black mypy
      
      - name: Run ruff
        run: ruff check . --output-format=github
        continue-on-error: true
      
      - name: Run black
        run: black --check --diff .
        continue-on-error: true
      
      - name: Run mypy
        run: mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sintaxis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov pytest-asyncio pytest-xdist pytest-mock
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run tests with coverage
        env:
          ENVIRONMENT: test
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: sintaxis_test
          MYSQL_USER: root
          MYSQL_PASSWORD: testpassword
          RAG_QDRANT_HOST: localhost
          RAG_QDRANT_PORT: 6333
          RAG_OLLAMA_MODEL: llama3.2:1b
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -n auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install bandit
        run: pip install bandit[toml]
      
      - name: Run bandit security scan
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
