{% extends "base.html" %}

{% block contenido %}

<h1>Listado de Expedientes</h1>

<!-- Botón de acción -->
<div style="margin-bottom: 20px;">
    <a href="/expedientes/nuevo" style="
        display: inline-block;
        padding: 10px 18px;
        background-color: #00b4d8;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        transition: 0.3s;
    " onmouseover="this.style.backgroundColor='#0077b6'" onmouseout="this.style.backgroundColor='#00b4d8'">
        ➕ Agregar Expediente
    </a>
</div>

<!-- Tabla de expedientes -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Carátula</th>
        </tr>
    </thead>
    <tbody>
        {% for exp in expedientes %}
        <tr>
            <td>{{ exp.id_expediente }}</td>
            <td>{{ exp.numero }}</td>
            <td>{{ exp.caratula }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
