[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de pytest
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    --ignore=tests/unit/test_api_models.py
    --ignore=tests/unit/test_gestor_batch.py

# Markers personalizados
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    e2e: End-to-end tests (require full system)
    slow: Slow running tests (skip with -m "not slow")
    rag: Tests that require RAG services (Qdrant, Ollama)
    db: Tests that require database
    browser: Tests that require Playwright browser

# Configuración de asyncio
asyncio_mode = auto

# Configuración de cobertura
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */node_modules/*
    */migrations/*
    */scripts/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
