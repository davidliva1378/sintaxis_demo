<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <meta http-equiv="refresh" content="60">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f2f9ff;
        }

        /* Menú lateral */
        .sidebar {
            position: fixed;
            width: 80px;
            height: 100vh;
            background-color: #012a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            margin: 25px 0;
            font-size: 24px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #90e0ef;
            transform: scale(1.2);
        }

        /* Barra superior */
        .header {
            margin-left: 80px;
            height: 60px;
            background-color: #0077b6;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Contenido */
        .content {
            margin-left: 80px;
            padding: 30px;
        }

        h1 {
            color: #023e8a;
        }

        /* Tablas */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th {
            background-color: #0096c7;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #caf0f8;
        }
    </style>
</head>
<body>

<!-- Menú lateral -->
<div class="sidebar">
    <a href="/">🏠</a>
    <a href="/expedientes">📁</a>
    <a href="/actuaciones">🧾</a>
    <a href="/reportes">📊</a>
</div>

<!-- Barra superior -->
<div class="header">
    Estudio Jurídico Liva
</div>

<!-- Contenido principal -->
<div class="content">
    {% block contenido %}{% endblock %}
</div>

</body>
</html>
