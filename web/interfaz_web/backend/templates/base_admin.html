<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        /* Menú lateral */
        .sidebar {
            position: fixed;
            width: 200px;
            height: 100vh;
            background-color: #1b263b;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #adb5bd;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 16px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background-color: #0d1b2a;
            padding-left: 25px;
        }

        /* Contenedor principal */
        .main {
            margin-left: 200px;
        }

        .header {
            background-color: #003049;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #023e8a;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ADMIN</h2>
    <a href="/admin">🏠 Panel principal</a>
    <a href="/expedientes">📁 Expedientes</a>
    <a href="/actuaciones">🧾 Actuaciones</a>
    <a href="/reportes">📊 Reportes</a>
    <a href="/usuarios">👥 Usuarios</a>
    <a href="/configuracion">⚙️ Configuración</a>
</div>

<div class="main">
    <div class="header">
        Panel de Administración - Estudio Jurídico
    </div>
    <div class="content">
        {% block contenido %}{% endblock %}
    </div>
</div>

</body>
</html>
